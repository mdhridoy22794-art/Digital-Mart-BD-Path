<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGradChatGPT" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#0A332C"/>
      <stop offset="50%" stop-color="#051B17"/>
      <stop offset="100%" stop-color="#020B0A"/>
    </radialGradient>

    <!-- Neon Glows -->
    <filter id="glowTeal" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="15" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Gradients -->
    <linearGradient id="openaiGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10A37F"/>
      <stop offset="50%" stop-color="#2DD4BF"/>
      <stop offset="100%" stop-color="#A7F3D0"/>
    </linearGradient>

    <linearGradient id="pedestalGradTeal" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#134E4A"/>
      <stop offset="100%" stop-color="#042F2E"/>
    </linearGradient>

    <linearGradient id="badgeGradTeal" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="600" height="600" fill="url(#bgGradChatGPT)"/>

  <!-- Cyber Grid Lines -->
  <g stroke="rgba(45, 212, 191, 0.15)" stroke-width="1.5">
    <line x1="0" y1="480" x2="600" y2="480"/>
    <line x1="0" y1="520" x2="600" y2="520"/>
    <line x1="0" y1="560" x2="600" y2="560"/>
    <line x1="100" y1="480" x2="40" y2="600"/>
    <line x1="200" y1="480" x2="160" y2="600"/>
    <line x1="300" y1="480" x2="300" y2="600"/>
    <line x1="400" y1="480" x2="440" y2="600"/>
    <line x1="500" y1="480" x2="560" y2="600"/>
  </g>

  <!-- Ambient Light Orbs -->
  <circle cx="200" cy="180" r="140" fill="#10B981" opacity="0.2" filter="blur(60px)"/>
  <circle cx="400" cy="220" r="140" fill="#2DD4BF" opacity="0.2" filter="blur(60px)"/>

  <!-- 3D Pedestal Base -->
  <ellipse cx="300" cy="460" rx="200" ry="40" fill="#02120F"/>
  <path d="M120 450 L150 490 L450 490 L480 450 Z" fill="url(#pedestalGradTeal)" stroke="#10B981" stroke-width="2"/>
  <ellipse cx="300" cy="450" rx="180" ry="25" fill="#042F2E" stroke="#2DD4BF" stroke-width="2"/>

  <!-- Floating Badges -->
  <g transform="translate(60, 140)">
    <rect width="110" height="42" rx="12" fill="rgba(6, 30, 26, 0.85)" stroke="#2DD4BF" stroke-width="1.5"/>
    <text x="55" y="26" fill="#2DD4BF" font-family="'Inter', sans-serif" font-weight="900" font-size="14" text-anchor="middle">GPT-4o</text>
  </g>

  <g transform="translate(430, 140)">
    <rect width="110" height="42" rx="12" fill="rgba(6, 30, 26, 0.85)" stroke="#10B981" stroke-width="1.5"/>
    <text x="55" y="26" fill="#10B981" font-family="'Inter', sans-serif" font-weight="900" font-size="13" text-anchor="middle">DALL-E 3</text>
  </g>

  <!-- Central 3D OpenAI Icon Box -->
  <g transform="translate(205, 130)" filter="url(#glowTeal)">
    <rect width="190" height="190" rx="42" fill="#031A15" stroke="url(#openaiGrad)" stroke-width="5"/>
    
    <!-- Stylized OpenAI Spiral Knot Icon -->
    <g transform="translate(95, 95) scale(0.65)" stroke="#2DD4BF" stroke-width="12" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M0 -60 C33 -60 60 -33 60 0 C60 20 50 38 35 48 L15 60 C-18 60 -45 33 -45 0 C-45 -20 -35 -38 -20 -48 Z" />
      <path d="M52 -30 C68 -2 68 35 45 58 C30 73 10 80 -10 75 L-30 65 C-46 37 -46 0 -23 -23 C-8 -38 12 -45 32 -40 Z" />
      <path d="M52 30 C35 58 -2 68 -30 52 C-50 40 -60 20 -60 0 L-60 -25 C-43 -53 -6 -63 22 -47 C42 -35 52 -15 52 5 Z" />
    </g>
  </g>

  <!-- Typography: Product Name & Title -->
  <text x="300" y="380" fill="#FFFFFF" font-family="'Inter', sans-serif" font-weight="900" font-size="38" text-anchor="middle" letter-spacing="2">
    CHATGPT PRO
  </text>
  <text x="300" y="415" fill="#2DD4BF" font-family="'Inter', sans-serif" font-weight="800" font-size="17" text-anchor="middle" letter-spacing="4">
    OPENAI TEAM ACCOUNT
  </text>

  <!-- Subtitle Tag -->
  <g transform="translate(150, 520)">
    <rect width="300" height="42" rx="21" fill="url(#badgeGradTeal)"/>
    <text x="150" y="27" fill="#FFFFFF" font-family="'Inter', sans-serif" font-weight="800" font-size="13" text-anchor="middle" letter-spacing="1">
      GPT-4o • VOICE MODE • DALL-E 3
    </text>
  </g>
</svg>
