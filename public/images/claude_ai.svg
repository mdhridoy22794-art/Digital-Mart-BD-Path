<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGradClaude" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#3D1A0C"/>
      <stop offset="50%" stop-color="#1A0B05"/>
      <stop offset="100%" stop-color="#0A0402"/>
    </radialGradient>

    <!-- Neon Glows -->
    <filter id="glowOrange" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="15" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Gradients -->
    <linearGradient id="claudeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D97706"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#FDE68A"/>
    </linearGradient>

    <linearGradient id="pedestalGradAmber" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#78350F"/>
      <stop offset="100%" stop-color="#2D1104"/>
    </linearGradient>

    <linearGradient id="badgeGradAmber" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="600" height="600" fill="url(#bgGradClaude)"/>

  <!-- Cyber Grid Lines -->
  <g stroke="rgba(245, 158, 11, 0.15)" stroke-width="1.5">
    <line x1="0" y1="480" x2="600" y2="480"/>
    <line x1="0" y1="520" x2="600" y2="520"/>
    <line x1="0" y1="560" x2="600" y2="560"/>
    <line x1="100" y1="480" x2="40" y2="600"/>
    <line x1="200" y1="480" x2="160" y2="600"/>
    <line x1="300" y1="480" x2="300" y2="600"/>
    <line x1="400" y1="480" x2="440" y2="600"/>
    <line x1="500" y1="480" x2="560" y2="600"/>
  </g>

  <!-- Ambient Light Orbs -->
  <circle cx="200" cy="180" r="140" fill="#D97706" opacity="0.2" filter="blur(60px)"/>
  <circle cx="400" cy="220" r="140" fill="#F59E0B" opacity="0.2" filter="blur(60px)"/>

  <!-- 3D Pedestal Base -->
  <ellipse cx="300" cy="460" rx="200" ry="40" fill="#0D0502"/>
  <path d="M120 450 L150 490 L450 490 L480 450 Z" fill="url(#pedestalGradAmber)" stroke="#D97706" stroke-width="2"/>
  <ellipse cx="300" cy="450" rx="180" ry="25" fill="#381504" stroke="#F59E0B" stroke-width="2"/>

  <!-- Floating Badges -->
  <g transform="translate(60, 140)">
    <rect width="110" height="42" rx="12" fill="rgba(35, 14, 4, 0.85)" stroke="#F59E0B" stroke-width="1.5"/>
    <text x="55" y="26" fill="#F59E0B" font-family="'Inter', sans-serif" font-weight="900" font-size="13" text-anchor="middle">SONNET 3.5</text>
  </g>

  <g transform="translate(430, 140)">
    <rect width="110" height="42" rx="12" fill="rgba(35, 14, 4, 0.85)" stroke="#D97706" stroke-width="1.5"/>
    <text x="55" y="26" fill="#FDE68A" font-family="'Inter', sans-serif" font-weight="900" font-size="13" text-anchor="middle">ARTIFACTS</text>
  </g>

  <!-- Central 3D Claude Sunburst Icon Box -->
  <g transform="translate(205, 130)" filter="url(#glowOrange)">
    <rect width="190" height="190" rx="42" fill="#1C0A03" stroke="url(#claudeGrad)" stroke-width="5"/>
    
    <!-- Anthropic Claude Spark / Sunburst Logo -->
    <g transform="translate(95, 95)" fill="url(#claudeGrad)">
      <polygon points="0,-65 16,-20 65,0 16,20 0,65 -16,20 -65,0 -16,-20"/>
      <polygon points="0,-45 12,-15 45,0 12,15 0,45 -12,15 -45,0 -12,-15" transform="rotate(45)" opacity="0.8"/>
    </g>
  </g>

  <!-- Typography: Product Name & Title -->
  <text x="300" y="380" fill="#FFFFFF" font-family="'Inter', sans-serif" font-weight="900" font-size="38" text-anchor="middle" letter-spacing="2">
    CLAUDE AI PRO
  </text>
  <text x="300" y="415" fill="#F59E0B" font-family="'Inter', sans-serif" font-weight="800" font-size="17" text-anchor="middle" letter-spacing="4">
    ANTHROPIC AI PRO PLAN
  </text>

  <!-- Subtitle Tag -->
  <g transform="translate(150, 520)">
    <rect width="300" height="42" rx="21" fill="url(#badgeGradAmber)"/>
    <text x="150" y="27" fill="#FFFFFF" font-family="'Inter', sans-serif" font-weight="800" font-size="13" text-anchor="middle" letter-spacing="1">
      CLAUDE 3.5 SONNET • ARTIFACTS • CODE
    </text>
  </g>
</svg>
