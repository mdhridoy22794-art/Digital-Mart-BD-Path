<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGradCapcut" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#2D114D"/>
      <stop offset="50%" stop-color="#120924"/>
      <stop offset="100%" stop-color="#07030F"/>
    </radialGradient>

    <!-- Neon Glows -->
    <filter id="glowPink" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="15" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="glowCyan" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Gradients -->
    <linearGradient id="capcutGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE"/>
      <stop offset="50%" stop-color="#4FACFE"/>
      <stop offset="100%" stop-color="#FF0844"/>
    </linearGradient>

    <linearGradient id="pedestalGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3B1869"/>
      <stop offset="100%" stop-color="#16082B"/>
    </linearGradient>

    <linearGradient id="goldBadge" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF512F"/>
      <stop offset="100%" stop-color="#DD2476"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="600" height="600" fill="url(#bgGradCapcut)"/>

  <!-- Cyber Grid Lines -->
  <g stroke="rgba(255, 8, 68, 0.15)" stroke-width="1.5">
    <line x1="0" y1="480" x2="600" y2="480"/>
    <line x1="0" y1="520" x2="600" y2="520"/>
    <line x1="0" y1="560" x2="600" y2="560"/>
    <line x1="100" y1="480" x2="40" y2="600"/>
    <line x1="200" y1="480" x2="160" y2="600"/>
    <line x1="300" y1="480" x2="300" y2="600"/>
    <line x1="400" y1="480" x2="440" y2="600"/>
    <line x1="500" y1="480" x2="560" y2="600"/>
  </g>

  <!-- Ambient Light Orbs -->
  <circle cx="150" cy="180" r="140" fill="#FF0844" opacity="0.18" filter="blur(60px)"/>
  <circle cx="450" cy="220" r="140" fill="#00F2FE" opacity="0.18" filter="blur(60px)"/>

  <!-- 3D Pedestal Base -->
  <ellipse cx="300" cy="460" rx="200" ry="40" fill="#0A0414"/>
  <path d="M120 450 L150 490 L450 490 L480 450 Z" fill="url(#pedestalGrad)" stroke="#FF0844" stroke-width="2"/>
  <ellipse cx="300" cy="450" rx="180" ry="25" fill="#200B3B" stroke="#00F2FE" stroke-width="2"/>

  <!-- Floating Badges Left & Right -->
  <!-- 4K UHD Badge -->
  <g transform="translate(60, 140)">
    <rect width="110" height="42" rx="12" fill="rgba(15, 6, 30, 0.85)" stroke="#00F2FE" stroke-width="1.5"/>
    <text x="55" y="26" fill="#00F2FE" font-family="'Inter', sans-serif" font-weight="900" font-size="14" text-anchor="middle">4K 60FPS</text>
  </g>

  <!-- Pro Effects Badge -->
  <g transform="translate(430, 140)">
    <rect width="110" height="42" rx="12" fill="rgba(15, 6, 30, 0.85)" stroke="#FF0844" stroke-width="1.5"/>
    <text x="55" y="26" fill="#FF0844" font-family="'Inter', sans-serif" font-weight="900" font-size="13" text-anchor="middle">PRO EFFECTS</text>
  </g>

  <!-- Central 3D CapCut Icon Box -->
  <g transform="translate(200, 130)" filter="url(#glowPink)">
    <rect width="200" height="200" rx="45" fill="#130826" stroke="url(#capcutGrad)" stroke-width="5"/>
    
    <!-- Stylized CapCut Scissors Symbol -->
    <path d="M45 75 L125 100 L155 70" fill="none" stroke="#00F2FE" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M45 125 L125 100 L155 130" fill="none" stroke="#FF0844" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="65" cy="70" r="10" fill="#00F2FE"/>
    <circle cx="65" cy="130" r="10" fill="#FF0844"/>
  </g>

  <!-- Typography: Product Name & Title -->
  <text x="300" y="380" fill="#FFFFFF" font-family="'Inter', sans-serif" font-weight="900" font-size="38" text-anchor="middle" letter-spacing="2">
    CAPCUT PRO
  </text>
  <text x="300" y="415" fill="#00F2FE" font-family="'Inter', sans-serif" font-weight="800" font-size="17" text-anchor="middle" letter-spacing="4">
    1 YEAR SUBSCRIPTION
  </text>

  <!-- Subtitle Tag -->
  <g transform="translate(150, 520)">
    <rect width="300" height="42" rx="21" fill="url(#goldBadge)"/>
    <text x="150" y="27" fill="#FFFFFF" font-family="'Inter', sans-serif" font-weight="800" font-size="13" text-anchor="middle" letter-spacing="1">
      PREMIUM VIDEO EDITOR • PC &amp; MOBILE
    </text>
  </g>
</svg>
